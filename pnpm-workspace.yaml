packages:
  - apps/web
  - services/*

# Native binding for the ESLint import resolver. pnpm 11 refuses to run a
# dependency's install scripts unless it is listed here, and treats an unapproved
# one as an error — so without this, `pnpm install --frozen-lockfile` fails in CI.
# `pnpm approve-builds --all` writes this block; the key is allowBuilds, not the
# older onlyBuiltDependencies.
allowBuilds:
  unrs-resolver: true
