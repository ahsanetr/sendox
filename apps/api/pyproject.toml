[project]
name = "sendox-api"
version = "0.1.0"
description = "Sendox API — AI-native multi-channel marketing platform for Shopify brands"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.2",
    "httpx>=0.28",
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.18",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.9",
    "cryptography>=43",
]

# Opt-in groups keep the default install small. torch-sized things live in `ml`.
[project.optional-dependencies]
ai = [
    "anthropic>=0.40",
    "chromadb>=1.5",
]
ml = [
    "sentence-transformers>=3.3",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sendox_api"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "C4", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "chromadb.*"]
ignore_missing_imports = true

# Celery's @task decorator is untyped, so strict mode flags every task it wraps.
# Narrowed to the tasks module rather than relaxed globally.
[[tool.mypy.overrides]]
module = ["sendox_api.tasks"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires live backing services (postgres, redis, chroma, mjml)",
]
