# Sendox local development stack.
#
#   make up        backing services + api + worker + beat   (web runs on host)
#   make up-full   everything including web in a container
#
# Web is deliberately NOT in the default set: Next.js HMR is much faster on the
# host than bind-mounted into a macOS container.

name: sendox

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sendox
      POSTGRES_PASSWORD: sendox
      POSTGRES_DB: sendox
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sendox -d sendox"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chromadb:
    image: chromadb/chroma:1.5.9
    ports: ["8001:8000"]
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/localhost/8000 && echo -e 'GET /api/v2/heartbeat HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'nanosecond'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Local inbox. SMTP on 1025, web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # MJML is Node-only, so the Python API renders email through this sidecar.
  mjml:
    build:
      context: ./services/mjml
    ports: ["7070:7070"]
    environment:
      PORT: 7070
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:7070/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Runs once per `up`, before anything touches the database.
  migrate:
    build:
      context: ./apps/api
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://sendox:sendox@postgres:5432/sendox
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build:
      context: ./apps/api
    command: ["uvicorn", "sendox_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://sendox:sendox@postgres:5432/sendox
      REDIS_URL: redis://redis:6379/0
      CHROMA_URL: http://chromadb:8000
      MJML_URL: http://mjml:7070
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    volumes:
      - ./apps/api/src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      chromadb: {condition: service_healthy}
      mjml: {condition: service_healthy}

  worker:
    build:
      context: ./apps/api
    command: ["celery", "-A", "sendox_api.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://sendox:sendox@postgres:5432/sendox
      REDIS_URL: redis://redis:6379/0
      CHROMA_URL: http://chromadb:8000
      MJML_URL: http://mjml:7070
    volumes:
      - ./apps/api/src:/app/src
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  beat:
    build:
      context: ./apps/api
    command: ["celery", "-A", "sendox_api.worker.celery_app", "beat", "--loglevel=INFO"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://sendox:sendox@postgres:5432/sendox
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./apps/api/src:/app/src
    depends_on:
      redis: {condition: service_healthy}

  web:
    profiles: ["full"]
    build:
      context: ./apps/web
    ports: ["3000:3000"]
    environment:
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      api: {condition: service_started}

volumes:
  postgres-data:
  redis-data:
  chroma-data:
